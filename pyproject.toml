[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-sentinel-api"
version = "0.3.0"
description = "API Sentinel API service (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "sentinel-core @ git+https://github.com/API-Sentinel-Team/api-sentinel-core.git@v0.3.0",
  "uvicorn[standard]==0.42.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.2.0",
  "pytest-asyncio==0.23.6",
  "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
include = ["server*"]
