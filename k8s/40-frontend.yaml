# API Sentinel frontend (nginx SPA). Proxies /api and /v1 to api-sentinel-backend.
# Image: harbor.wecrew.in/finspot/api-sentinel-frontend:latest
# Public host: https://sentinel.wecrew.in/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-sentinel-frontend
  namespace: api-sentinel
  labels:
    app: api-sentinel-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api-sentinel-frontend
  template:
    metadata:
      labels:
        app: api-sentinel-frontend
    spec:
      imagePullSecrets:
        - name: harbor-finspot-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: harbor.wecrew.in/finspot/api-sentinel-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-sentinel-frontend
  namespace: api-sentinel
  labels:
    app: api-sentinel-frontend
spec:
  selector:
    app: api-sentinel-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
