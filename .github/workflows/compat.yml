name: Cross-service compatibility

# The repos are separate, so no single repo's CI can prove that the API and the scan-worker work
# together. This installs the pinned sentinel-core plus the scan-worker at the versions below and
# runs the API<->worker tests (tests/cross_service). Bump the refs when a service is released.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  DEBUG: "true"
  CORE_REF: v0.3.1
  WORKER_REF: v0.3.2

jobs:
  cross-service:
    name: API + scan-worker + core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Let pip read the private repos
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install core, scan-worker and this API together
        run: |
          python -m pip install --upgrade pip
          pip install "sentinel-core @ git+https://github.com/API-Sentinel-Team/api-sentinel-core.git@${CORE_REF}"
          pip install --no-deps "git+https://github.com/API-Sentinel-Team/api-sentinel-scan-worker.git@${WORKER_REF}"
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Cross-service tests
        run: pytest tests/cross_service -q
