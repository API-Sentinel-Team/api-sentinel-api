# Production reverse proxy for API Sentinel + Argus eBPF sensor ingest.
# Replace TLS paths and server_name before use.
#
# Sensor → https://api.example.com/v1/events
# App/API → https://api.example.com/api/
#
# Upstream: uvicorn listening on backend:8000 (Docker network) or 127.0.0.1:8000

upstream api_sentinel_backend {
    least_conn;
    server fastapi:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limits (tune for your fleet size; sensors may burst)
limit_req_zone $binary_remote_addr zone=sensor_ingest_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=200r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS — enable after confirming HTTPS works end-to-end
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 32m;
    client_body_buffer_size 128k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ─── Sensor ingest (high volume; larger timeouts, optional IP allowlist) ───
    location /v1/events {
        limit_req zone=sensor_ingest_limit burst=200 nodelay;

        # Optional: restrict to known sensor egress IPs / VPC NAT
        # allow 10.0.0.0/8;
        # deny all;

        proxy_pass http://api_sentinel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering on;
    }

    # ─── REST API + WebSockets ───
    location /api/ {
        limit_req zone=api_general_limit burst=100 nodelay;

        proxy_pass http://api_sentinel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_buffering off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── Kubernetes / LB probes ───
    location /api/health/ready {
        proxy_pass http://api_sentinel_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Refuse other paths on API host (or serve SPA if combined host)
    location / {
        return 404;
    }
}
