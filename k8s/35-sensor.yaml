# eBPF sensor DaemonSet — API-Sensor (session-4-production-fixes)
# Image: harbor.wecrew.in/finspot/api-sentinel-sensor:latest
# Ingest: in-cluster POST /v1/events (Bearer sensor_key).
#
# Prerequisites:
#   ./k8s/build-and-push.sh sensor
#   ./k8s/create-secrets.sh          # creates api-sentinel-sensor secret
#   ./k8s/register-sensor.sh         # upserts hashed key in Postgres (backend must be up)
#
# One privileged pod per node. kind `wecrew` is a single control-plane node, so
# the control-plane taint must be tolerated (included below).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sentinel-sensor
  namespace: api-sentinel
  labels:
    app: api-sentinel-sensor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-sentinel-sensor
  labels:
    app: api-sentinel-sensor
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-sentinel-sensor
  labels:
    app: api-sentinel-sensor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-sentinel-sensor
subjects:
  - kind: ServiceAccount
    name: api-sentinel-sensor
    namespace: api-sentinel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-sentinel-sensor
  namespace: api-sentinel
  labels:
    app: api-sentinel-sensor
data:
  INGEST_URL: "http://api-sentinel-backend.api-sentinel.svc.cluster.local:8000/v1/events"
  BATCH_SIZE: "200"
  ROLE: "server"
  METRICS_PORT: "9091"
  SAMPLE_DEFAULT: "100"
  SAMPLE_HEALTH: "5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-sentinel-sensor-entrypoint
  namespace: api-sentinel
  labels:
    app: api-sentinel-sensor
data:
  discover-and-run.sh: |
    #!/bin/bash
    # --discover-libs is a no-op when --pid is -1. Scan hostPID /proc maps and
    # attach uprobes to each unique libssl/libgnutls inode (ingress-nginx,
    # app containers, node binaries).
    set -euo pipefail
    libs=()
    declare -A seen=()
    add_lib() {
      local p="$1" id
      [[ -f "$p" ]] || return 0
      id="$(stat -c '%d:%i' "$p" 2>/dev/null || true)"
      [[ -n "$id" ]] || return 0
      if [[ -z "${seen[$id]:-}" ]]; then
        seen[$id]=1
        libs+=("$p")
      fi
    }
    add_lib /usr/lib/x86_64-linux-gnu/libssl.so.3
    add_lib /lib/x86_64-linux-gnu/libssl.so.3
    add_lib /host/usr/lib/x86_64-linux-gnu/libssl.so.3
    add_lib /host/lib/x86_64-linux-gnu/libssl.so.3
    for maps in /proc/[0-9]*/maps; do
      pid="${maps#/proc/}"
      pid="${pid%/maps}"
      [[ "$pid" =~ ^[0-9]+$ ]] || continue
      while IFS= read -r path; do
        [[ "$path" == /* ]] || continue
        add_lib "/proc/${pid}/root${path}"
      done < <(awk '/libssl\.so|libgnutls\.so/ {print $6}' "$maps" 2>/dev/null | sort -u)
    done
    if ((${#libs[@]})); then
      joined=$(IFS=,; echo "${libs[*]}")
      echo "discovered TLS libs (${#libs[@]}): $joined" >&2
      exec /usr/local/bin/api-sec-sensor --tls-libs "$joined" "$@"
    fi
    exec /usr/local/bin/api-sec-sensor "$@"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: api-sentinel-sensor
  namespace: api-sentinel
  labels:
    app: api-sentinel-sensor
spec:
  selector:
    matchLabels:
      app: api-sentinel-sensor
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: api-sentinel-sensor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: api-sentinel-sensor
      imagePullSecrets:
        - name: harbor-finspot-pull
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      containers:
        - name: sensor
          image: harbor.wecrew.in/finspot/api-sentinel-sensor:20260816-fixes
          imagePullPolicy: Always
          command: ["/bin/bash", "/config/discover-and-run.sh"]
          args:
            - --bpf
            - /app/bpf/http_trace.bpf.o
            - --ingest
            - $(INGEST_URL)
            - --account-id
            - $(ACCOUNT_ID)
            - --metrics-port
            - $(METRICS_PORT)
            - --batch-size
            - $(BATCH_SIZE)
            - --role
            - $(ROLE)
            - --sample-default
            - $(SAMPLE_DEFAULT)
            - --sample-health
            - $(SAMPLE_HEALTH)
            - --discover-libs
          envFrom:
            - configMapRef:
                name: api-sentinel-sensor
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-sentinel-sensor
                  key: api-key
            - name: PII_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: api-sentinel-sensor
                  key: pii-hash-key
            - name: ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: api-sentinel-sensor
                  key: account-id
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CRI_SOCKET
              value: /run/containerd/containerd.sock
            - name: RUST_LOG
              value: info
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
                - SYS_RESOURCE
                - BPF
                - PERFMON
                - NET_ADMIN
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: bpf
              mountPath: /sys/fs/bpf
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: debug
              mountPath: /sys/kernel/debug
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: containerd
              mountPath: /run/containerd/containerd.sock
            - name: entrypoint
              mountPath: /config
              readOnly: true
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: containerd
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: entrypoint
          configMap:
            name: api-sentinel-sensor-entrypoint
            defaultMode: 0555
        - name: host-root
          hostPath:
            path: /
            type: Directory
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
---
apiVersion: v1
kind: Service
metadata:
  name: api-sentinel-sensor-metrics
  namespace: api-sentinel
  labels:
    app: api-sentinel-sensor
spec:
  selector:
    app: api-sentinel-sensor
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
